name: Import front-page photograph

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-photo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the supplied photograph into this repository
        shell: bash
        run: |
          if [ -f assets/tong-zhu.png ]; then
            echo "The photograph is already stored in this repository."
            exit 0
          fi
          mkdir -p assets
          curl --fail --location --retry 3 'https://tong-zhu-materials.rubyauk.chatgpt.site/assets/tong-zhu.png' --output assets/tong-zhu.png
          echo 'c171b8279d53e9dddad8da13fe42435a4d4484f8be3f4f7374dd1ba1ad314052  assets/tong-zhu.png' | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tong-zhu.png
          git commit -m 'Add the supplied front-page photograph'
          git push
